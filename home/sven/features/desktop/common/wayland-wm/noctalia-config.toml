config_version = 14

[bar.default]
center = [ "media", "active_window" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clock",
    "control-center",
    "session"
]
margin_ends = 0.0
position = "left"
scale = 1.2500000111758709
start = [ "launcher", "workspaces" ]
widget_spacing = 20

    [bar.default.monitor.HDMI-A-1]
    center = [ "active_window" ]
    end = [ "notifications", "clipboard", "clock", "control-center", "session" ]
    position = "top"
    start = [ "workspaces" ]

[calendar]
enabled = true

    [calendar.account.fischereiaderssen]
    type = "google"

[location]
address = "Moitzfeld"
sunset = "23:00"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1920.0
    cy = 2041.0
    output = "DP-2"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 720.0
    cy = 2441.0
    output = "HDMI-A-1"
    placement_height = 2560.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
avatar_path = "~/.face"
launch_apps_as_systemd_services = true
polkit_agent = true
telemetry_enabled = false

    [shell.screen_corners]
    enabled = true
    size = 28

[system.monitor]
gpu_poll_seconds = 2

[theme]

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
enabled = false

[weather]

[widget.clock]
tooltip_format = "{:%A, %d.%m.%Y}"

[widget.network]
show_label = false

[widget.workspaces]
active_pill_size = 2.0
show_all_outputs = true
